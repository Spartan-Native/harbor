# Publishes the project page (site/ plus docs/images) and the live demo (the Angular app,
# under demo/) to GitHub Pages at https://spartan-native.github.io/harbor/.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Local preview of the page: npm run build:site && npx serve dist/site
# (the demo is built for the /harbor/demo/ path, so it only runs once deployed).

name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site and the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:site:demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
